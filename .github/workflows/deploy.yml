name: Deploy to Porkbun

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git lfs install
          git lfs track "*.mp4" "*.mov" "*.webm"
          git add .gitattributes
          git add .
          git commit -m "Deploy"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/unclepauliees/peprowebsite.git"
          git push --force origin HEAD:deploy
